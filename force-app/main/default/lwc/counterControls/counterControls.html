<template>
    <lightning-card title="Counter Controls" icon-name="utility:touch_action">
        <div class="slds-var-p-around_medium">
            <lightning-button-group>
                <lightning-button
                    label="-"
                    onclick={handleDecrement}
                ></lightning-button>
                <lightning-button
                    label="Reset"
                    variant="brand"
                    onclick={handleReset}
                ></lightning-button>
                <lightning-button
                    label="+"
                    variant="brand"
                    onclick={handleIncrement}
                ></lightning-button>
            </lightning-button-group>
            <div class="slds-var-m-top_medium">
                <lightning-input
                    type="number"
                    label="Set count"
                    value={inputValue}
                    onchange={handleInputChange}
                >
                </lightning-input>
                <lightning-button
                    label="Apply"
                    onclick={handleApply}
                    class="slds-var-m-top_small"
                >
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
