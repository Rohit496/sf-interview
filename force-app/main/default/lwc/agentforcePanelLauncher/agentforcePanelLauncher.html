<template>
    <lightning-card
        title="Agentforce ACC API Demo"
        icon-name="utility:einstein"
    >
        <div
            class="panel-content slds-var-p-horizontal_medium slds-var-p-bottom_medium"
        >
            <!-- Panel controls: open() and close() -->
            <section
                class="slds-var-m-bottom_large"
                aria-labelledby="panel-heading"
            >
                <h3
                    id="panel-heading"
                    class="slds-text-title_caps slds-text-color_weak slds-var-m-bottom_x-small"
                >
                    Panel
                </h3>
                <lightning-button-group>
                    <lightning-button
                        variant="brand"
                        label="Open"
                        title="Open the Agentforce side panel"
                        icon-name="utility:expand_alt"
                        onclick={handleOpen}
                    >
                    </lightning-button>
                    <lightning-button
                        variant="neutral"
                        label="Close"
                        title="Close the Agentforce side panel"
                        icon-name="utility:close"
                        onclick={handleClose}
                    >
                    </lightning-button>
                </lightning-button-group>
            </section>

            <!-- Message / execute(): type a message, then send it -->
            <section aria-labelledby="message-heading">
                <h3
                    id="message-heading"
                    class="slds-text-title_caps slds-text-color_weak slds-var-m-bottom_x-small"
                >
                    Send a Message
                </h3>
                <lightning-layout
                    vertical-align="end"
                    horizontal-align="spread"
                >
                    <lightning-layout-item flexibility="grow">
                        <lightning-input
                            type="text"
                            label="Message"
                            placeholder="Type a message for the agent..."
                            value={utterance}
                            onchange={handleUtteranceChange}
                        >
                        </lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item
                        flexibility="no-grow"
                        class="slds-var-p-left_x-small"
                    >
                        <lightning-button
                            variant="brand"
                            label="Execute"
                            title="Send the message to the agent"
                            icon-name="utility:send"
                            onclick={handleExecute}
                        >
                        </lightning-button>
                    </lightning-layout-item>
                </lightning-layout>
            </section>
        </div>
    </lightning-card>
</template>
